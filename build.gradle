plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_name}_neoforge-${project.minecraft_version}"
}

// Release asset name matches the other loaders: guildquests_neoforge-1.21.1_<version>.jar
tasks.named('jar') {
    archiveFileName = "${base.archivesName.get()}_${project.version}.jar"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        guildquests {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.guildquests
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    compileOnly "maven.modrinth:create:${project.create_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

test { useJUnitPlatform() }

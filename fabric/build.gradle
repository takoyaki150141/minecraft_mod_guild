plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = 'guildquests_fabric-1.20.1'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modCompileOnly "maven.modrinth:create-fabric:$rootProject.create_fabric_version"
    modCompileOnly fileTree(dir: "$rootDir/libs/nested-mods", include: '*.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation(project(path: ':common', configuration: 'namedElements')) { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }

    // Fabric Loader resolves the access widener and mixin config from this module's
    // own root in the dev runtime (where fabric.mod.json lives), so expose common's
    // copies there too.
    from(rootProject.file('common/src/main/resources/guildquests.accesswidener'))
    from(rootProject.file('common/src/main/resources/guildquests.mixins.json'))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    from(rootProject.file('LICENSE')) {
        rename { "${it}_guildquests" }
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

remapJar {
    archiveFileName = "${base.archivesName.get()}_${project.version}.jar"
}

if (providers.gradleProperty('fxDebug').isPresent()) {
    apply from: 'fx-debug.gradle'
}

if (providers.gradleProperty('bossDebug').isPresent()) {
    apply from: 'boss-debug.gradle'
}
